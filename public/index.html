<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>PeaceTweet — সুন্নাহ আঁকড়ে, উম্মাহর পাশে</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('peacetweet_theme');
          if (
            theme === 'dark' ||
            (!theme &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        color: #050505;
        font-family:
          'Raleway',
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      html.dark,
      html.dark body {
        background-color: #18191a;
        color: #e4e6eb;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      @keyframes pt-pulse-fade {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }
      .pt-initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        user-select: none;
        overflow: hidden;
      }
      html.dark .pt-initial-loader {
        background-color: #18191a;
      }
      .pt-center-logo {
        width: 80px;
        height: 80px;
        border-radius: 24px;
        overflow: hidden;
        filter: drop-shadow(0 4px 6px rgba(24, 119, 242, 0.15));
        animation: pt-pulse-fade 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @media (min-width: 640px) {
        .pt-center-logo {
          width: 96px;
          height: 96px;
        }
      }
      .pt-bottom-brand {
        position: absolute;
        bottom: 32px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        text-align: center;
        padding: 0 16px;
      }
      @media (min-width: 640px) {
        .pt-bottom-brand {
          bottom: 40px;
        }
      }
      .pt-from-label {
        font-size: 11px;
        font-weight: 600;
        color: #8a8d91;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      html.dark .pt-from-label {
        color: #b0b3b8;
      }
      .pt-brand-row {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 8px;
      }
      .pt-mini-logo {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .pt-brand-name {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: -0.025em;
        background: linear-gradient(to right, #1565d8, #1877f2, #0d9488);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }
      .pt-slogan {
        margin: 0;
        padding-top: 2px;
        font-size: 12px;
        font-weight: 500;
        color: #65676b;
        letter-spacing: 0.025em;
      }
      @media (min-width: 640px) {
        .pt-slogan {
          font-size: 13px;
        }
      }
      html.dark .pt-slogan {
        color: #b0b3b8;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="pt-initial-loader" role="status" aria-label="Loading PeaceTweet">
        <div class="pt-center-logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
            <defs>
              <linearGradient id="pt-html-g1" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#1877f2" />
                <stop offset="1" stop-color="#1054be" />
              </linearGradient>
            </defs>
            <rect width="512" height="512" rx="112" fill="url(#pt-html-g1)" />
            <path
              fill="#e8f0fe"
              fill-rule="evenodd"
              transform="translate(-29 0)"
              d="M170 110H285A115 115 0 0 1 285 340H250V512H170Z M250 190H285A35 35 0 0 1 285 260H250Z"
            />
          </svg>
        </div>

        <div class="pt-bottom-brand">
          <span class="pt-from-label">from</span>
          <div class="pt-brand-row">
            <div class="pt-mini-logo">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="20" height="20">
                <defs>
                  <linearGradient id="pt-html-g2" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#1877f2" />
                    <stop offset="1" stop-color="#1054be" />
                  </linearGradient>
                </defs>
                <rect width="512" height="512" rx="112" fill="url(#pt-html-g2)" />
                <path
                  fill="#e8f0fe"
                  fill-rule="evenodd"
                  transform="translate(-29 0)"
                  d="M170 110H285A115 115 0 0 1 285 340H250V512H170Z M250 190H285A35 35 0 0 1 285 260H250Z"
                />
              </svg>
            </div>
            <span class="pt-brand-name">PeaceTweet</span>
          </div>
          <p class="pt-slogan">সুন্নাহ আঁকড়ে, উম্মাহর পাশে</p>
        </div>
      </div>
    </div>
  </body>
</html>
